name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Numer wersji (np. v0.1.0)'
        required: true
        default: 'v0.1.0'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install

      - name: Build Tauri app
        run: bun run tauri build

      - name: Prepare Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets
          Copy-Item "src-tauri/target/release/rust-reader.exe" -Destination "release-assets/rust-reader.exe"
          Copy-Item "src-tauri/pl_50k.txt" -Destination "release-assets/pl_50k.txt"
          Compress-Archive -Path "release-assets/rust-reader.exe", "release-assets/pl_50k.txt" -DestinationPath "release-assets/rust-reader-windows-x64.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v0.1.0' }}
          name: 'Rust Reader ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'v0.1.0' }}'
          body: |
            ## 🦀 Rust Reader - Oficjalne Wydanie
            
            Pobierz poniższe pliki i umieść je w tym samym folderze:
            * **`rust-reader.exe`** – Główna aplikacja (wersja przenośna / standalone)
            * **`pl_50k.txt`** – Słownik 50 000 polskich słów do modułu auto-korekty SymSpell
            
            *Możesz również pobrać **`rust-reader-windows-x64.zip`**, w którym oba pliki są już spakowane razem.*
          files: |
            release-assets/rust-reader.exe
            release-assets/pl_50k.txt
            release-assets/rust-reader-windows-x64.zip
          draft: false
          prerelease: false
